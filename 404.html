<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="해움한국어 홈페이지 주소가 haeum.haeonkorean.com 으로 변경되었습니다." />
    <link rel="canonical" href="https://haeum.haeonkorean.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>해움한국어 — 새 주소 안내</title>
    <style>
      :root {
        --bg: #fdfaf6;
        --text: #2f2f2f;
        --muted: #5b5b5b;
        --brand: #317873;
        --brand-deep: #4a5d52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 520px;
        background: #ffffff;
        border: 1px solid rgba(49, 120, 115, 0.14);
        border-radius: 20px;
        padding: 40px 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(47, 47, 47, 0.06);
      }

      .brand {
        margin: 0 0 20px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--brand-deep);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(20px, 4vw, 26px);
        font-weight: 600;
        color: var(--brand-deep);
      }

      p {
        margin: 0 0 8px;
        font-size: 15px;
        color: var(--muted);
      }

      p.en {
        margin: 0 0 28px;
        font-size: 13px;
        color: #8a8a8a;
      }

      .primary {
        display: inline-block;
        padding: 12px 26px;
        border-radius: 999px;
        background: var(--brand);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: background 160ms ease;
      }

      .primary:hover,
      .primary:focus-visible {
        background: var(--brand-deep);
      }

      .secondary {
        margin: 20px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .secondary a {
        color: var(--brand);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .note {
        margin: 24px 0 0;
        font-size: 12px;
        color: #9a9a9a;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">해움한국어</p>
      <h1>새 주소로 이사했습니다</h1>
      <p>이 주소(haeumkorean.me)는 더 이상 업데이트되지 않습니다.<br />아래 링크에서 이용해 주세요.</p>
      <p class="en">Haeum Korean has moved to a new address.</p>
      <a class="primary" href="https://haeum.haeonkorean.com/">haeum.haeonkorean.com 으로 이동</a>
      <p class="secondary">어휘 학습은 <a href="https://words.haeonkorean.com">words.haeonkorean.com</a> 에서 계속됩니다.</p>
      <p class="note">즐겨찾기를 새 주소로 바꿔 주세요.</p>
    </main>
  </body>
</html>
